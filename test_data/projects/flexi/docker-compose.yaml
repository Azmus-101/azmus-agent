services:
  app_blue:
    build:
      context: .
      target: production
    container_name: flexi-backend-blue
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    ports:
      - "3001:5000"
    command: npm start
    healthcheck:
      # test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/dist/logs
      - ./cloudfront-private-key.pem:/app/cloudfront-private-key.pem:ro
    restart: unless-stopped

  app_green:
    build:
      context: .
      target: production
    container_name: flexi-backend-green
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    working_dir: /app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    ports:
      - "3002:5000"
    command: npm start
    healthcheck:
      # test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/dist/logs
      - ./cloudfront-private-key.pem:/app/cloudfront-private-key.pem:ro
  redis:
    image: redis:alpine
    container_name: physical-therapy-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  analysis-worker:
    build:
      context: .
      target: production
    container_name: flexi-analysis-worker
    environment:
      - NODE_ENV=production
      - ANALYSIS_WORKER_CONCURRENCY=10
      - ANALYSIS_WORKER_RECONCILE_INTERVAL_MS=60000
    env_file:
      - .env
    working_dir: /app
    command: npm run worker
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/dist/logs
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
          - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
          - ./certbot/www:/var/www/certbot
          - ./certbot/conf:/etc/letsencrypt
          - /home/ubuntu/flexi-website/dist:/usr/share/nginx/html:ro
    depends_on:
      app_blue:
        condition: service_healthy
      app_green:
        condition: service_healthy
  migrate:
    build:
      context: .
      target: builder         # needs prisma CLI (devDependency) + compiled dist/
    command: sh -c "npx prisma generate && npx prisma migrate deploy"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  seed:
    build:
      context: .
      target: builder 
    command: npm run seed
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    profiles: ["prod"]

volumes:
  pgdata:
